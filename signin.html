<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Virtual Labs</title>
  <link rel="stylesheet" href="sign.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="sign.js" defer></script>
</head>
<body>
  <!-- Header -->
  <nav class="navbar">
    <div class="logo"><i class="fa-solid fa-flask"></i>Virtual Labs</div>
    <div class="controls">
      <button class="toggle-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
      <a href="index.html" class="btn">Home</a>
    </div>
  </nav>

  <!-- Main Form Section -->
  <main class="form-wrapper">
    <!-- Sign In Form -->
    <div class="form-box" id="signinForm">
      <h2>Sign In</h2>
      <input type="text" id="loginUsername" placeholder="Username" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button onclick="handleLogin()">Login</button>
      <p class="link-text">
        <a href="#" onclick="showForm('registerForm')">New User? Register</a> |
        <a href="#" onclick="showForm('forgotForm')">Forgot Password?</a>
      </p>
    </div>

    <!-- Register Form -->
    <div class="form-box hidden" id="registerForm">
      <h2>Register</h2>
      <input type="text" id="regName" placeholder="Full Name" required />
      <input type="text" id="regMobile" placeholder="Mobile No." required />
      <input type="email" id="regEmail" placeholder="Email" required />
      <select id="regGender" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
      <input type="number" id="regAge" placeholder="Age" required />
      <input type="password" id="regPassword" placeholder="Set Password" required />
      <button onclick="handleRegister()">Register</button>
      <p class="link-text">
        <a href="#" onclick="showForm('signinForm')">Back to Sign In</a>
      </p>
    </div>

    <!-- Forgot Password Form -->
    <div class="form-box hidden" id="forgotForm">
      <h2>Reset Password</h2>
      <input type="email" id="forgotEmail" placeholder="Enter Email" required />
      <input type="text" id="resetCode" placeholder="Enter Verification Code" required />
      <button onclick="handlePasswordReset()">Submit</button>
      <p class="link-text">
        <a href="#" onclick="showForm('signinForm')">Back to Sign In</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2025 Virtual Labs — All rights reserved.</p>
  </footer>
</body>
</html>
